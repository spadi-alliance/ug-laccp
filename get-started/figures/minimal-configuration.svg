<text x="880" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#087f83">Sync + offsets</text>
<polyline points="1080,322 1080,442" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="1017.96" y="378" width="124.08" height="29" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1080" y="399" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#087f83">Sync status</text>
<polyline points="1280,322 1280,442" fill="none" stroke="#547084" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#signal)" marker-start="url(#signal)"/>
<rect x="1236.52" y="344" width="86.96" height="29" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
