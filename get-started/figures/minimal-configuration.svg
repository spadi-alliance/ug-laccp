<rect x="487.46" y="358" width="95.08" height="31" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="535" y="381" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#516779">HBU bus</text>
<polyline points="880,442 880,322" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
