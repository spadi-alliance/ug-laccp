<text x="1080" y="269" font-family="Consolas, monospace" font-size="24" font-weight="700" text-anchor="middle" fill="#183044">HeartBeatUnit</text>
<text x="1080" y="300" font-family="Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle" fill="#516779">heartbeatCount  /  hbfNumber</text>
<rect x="790" y="442" width="580" height="91" rx="12" fill="#eaf7f7" stroke="#91c9c9" stroke-width="1.5"/>
<text x="1080" y="477" font-family="Consolas, monospace" font-size="25" font-weight="700" text-anchor="middle" fill="#087f83">LaccpMainBlock</text>
<text x="1080" y="509" font-family="Consolas, monospace" font-size="19" font-weight="400" text-anchor="middle" fill="#087f83">kPrimaryMode = false</text>
<rect x="790" y="683" width="580" height="87" rx="12" fill="#edf5fc" stroke="#9dbed7" stroke-width="1.5"/>
<text x="1080" y="718" font-family="Consolas, monospace" font-size="24" font-weight="700" text-anchor="middle" fill="#187caa">MikumariBlock</text>
