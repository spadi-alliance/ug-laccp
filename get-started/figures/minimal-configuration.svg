<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1260" viewBox="0 0 1440 1260" role="img" aria-labelledby="title desc">
<title id="title">Minimal primary-secondary LACCP configuration</title>
<desc id="desc">A conceptual two-FPGA configuration. Each FPGA contains an external Heartbeat Unit, LaccpMainBlock and MikumariBlock. Only selected interfaces are shown. The physical connection is bidirectional. Key synchronization connections are specified below the diagram. Sources: LACCP/laccp/LaccpMainBlock.vhd, PrimaryHeartBeatUnit.vhd, HeartBeatUnit.vhd, defLaccp.vhd; mikumari/mikumari-link/Wrapper/MikumariBlock.vhd.</desc>
<defs>
<marker id="signal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#547084"/></marker>
<marker id="clock" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#ad5c1c"/></marker>
<marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#087f83"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="1260" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="40" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#087f83">FIGURE 2  /  MINIMAL CONFIGURATION</text>
<text x="40" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#183044">One primary, one secondary</text>
<text x="40" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#516779">Selected interfaces only; arrows show signal direction, not clock-cycle timing.</text>
<rect x="40" y="148" width="640" height="655" rx="16" fill="#f8fafc" stroke="#cdd9e2" stroke-width="1.5"/>
