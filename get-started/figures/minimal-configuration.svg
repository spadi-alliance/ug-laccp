<text x="720" y="660" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#ad5c1c">Duplex link</text>
<text x="40" y="847" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#183044">Key synchronization connections</text>
<rect x="40" y="866" width="1360" height="48" rx="0" fill="#f4f8fa" stroke="#dbe4eb" stroke-width="1.5"/>
<text x="56" y="896" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#183044">Primary heartbeat</text>
<text x="275" y="896" font-family="Consolas, monospace" font-size="17" font-weight="400" text-anchor="start" fill="#183044">PrimaryHeartBeatUnit.heartbeatOut &#8594; LaccpMainBlock.syncPulseIn</text>
<rect x="40" y="914" width="1360" height="48" rx="0" fill="#ffffff" stroke="#dbe4eb" stroke-width="1.5"/>
<text x="56" y="944" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#183044">Secondary sync</text>
<text x="275" y="944" font-family="Consolas, monospace" font-size="17" font-weight="400" text-anchor="start" fill="#183044">LaccpMainBlock.syncPulseOut &#8594; HeartBeatUnit.syncPulseIn</text>
<rect x="40" y="962" width="1360" height="48" rx="0" fill="#f4f8fa" stroke="#dbe4eb" stroke-width="1.5"/>
<text x="56" y="992" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#183044">Secondary offsets</text>
<text x="275" y="992" font-family="Consolas, monospace" font-size="17" font-weight="400" text-anchor="start" fill="#183044">LaccpMainBlock.hbcOffset / validOffset &#8594; HeartBeatUnit.hbcOffsetIn / validOffsetIn</text>
<rect x="40" y="1010" width="1360" height="48" rx="0" fill="#ffffff" stroke="#dbe4eb" stroke-width="1.5"/>
<text x="56" y="1040" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#183044">Secondary feedback</text>
<text x="275" y="1040" font-family="Consolas, monospace" font-size="17" font-weight="400" text-anchor="start" fill="#183044">HeartBeatUnit.isSynchronized &#8594; LaccpMainBlock.hbuIsSyncedIn</text>
<rect x="40" y="1058" width="1360" height="48" rx="0" fill="#f4f8fa" stroke="#dbe4eb" stroke-width="1.5"/>
<text x="56" y="1088" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#183044">HBU bus</text>
<text x="275" y="1088" font-family="Consolas, monospace" font-size="17" font-weight="400" text-anchor="start" fill="#183044">External intra port 0 &#8596; Heartbeat Unit LACCP Bus (data / valid / ready)</text>
<text x="40" y="1140" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#516779">Clock domains: each node&#x27;s LaccpMainBlock.clk and HBU.clk use its local MIKUMARI clkPar domain.</text>
<text x="40" y="1170" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#516779">Clock generation / recovery, resets, calibration inputs, user I/O and unused ports are omitted.</text>
<text x="40" y="1200" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#516779">The secondary user data path also consumes LaccpMainBlock.fineOffset.</text>
</svg>
