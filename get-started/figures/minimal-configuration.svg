<text x="360" y="477" font-family="Consolas, monospace" font-size="25" font-weight="700" text-anchor="middle" fill="#087f83">LaccpMainBlock</text>
<text x="360" y="509" font-family="Consolas, monospace" font-size="19" font-weight="400" text-anchor="middle" fill="#087f83">kPrimaryMode = true</text>
<rect x="70" y="683" width="580" height="87" rx="12" fill="#edf5fc" stroke="#9dbed7" stroke-width="1.5"/>
