<text x="64" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#516779">Reference clock source</text>
<rect x="70" y="235" width="580" height="87" rx="12" fill="#f1f5f9" stroke="#aebfcd" stroke-width="1.5"/>
<text x="360" y="269" font-family="Consolas, monospace" font-size="24" font-weight="700" text-anchor="middle" fill="#183044">PrimaryHeartBeatUnit</text>
<text x="360" y="300" font-family="Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle" fill="#516779">heartbeatCount  /  hbfNumber</text>
