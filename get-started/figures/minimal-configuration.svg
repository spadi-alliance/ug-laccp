<text x="950" y="591" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#516779">Frames + pulses</text>
<polyline points="1220,683 1220,533" fill="none" stroke="#547084" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#signal)"/>
<rect x="1130.12" y="599" width="179.76" height="30" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
