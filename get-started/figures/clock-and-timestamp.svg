<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
<title id="title">Clock, heartbeat, and timestamp relationships in LACCP</title>
<desc id="desc">Conceptual timing after coarse synchronization. The primary and secondary clocks have the same frequency but retain a phase offset. In this example the secondary heartbeat is earlier, so its signed fine offset is negative. The acquisition logic applies the correction to timestamps. The lower diagram shows the MIKUMARI link, LACCP, external Heartbeat Units, and DAQ logic. Inspired by slide 9 of R. Honda, MIKUMARI, the time synchronization protocol in the SPADI Alliance, SRO XIV. Checked against LACCP/laccp/RCAP.vhd, HeartBeatUnit.vhd, PrimaryHeartBeatUnit.vhd, and LaccpMainBlock.vhd. Clock and pulse widths are schematic; internal pipelines and user port wiring are omitted.</desc>
