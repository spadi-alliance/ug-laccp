<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc">
  <title id="title">LACCP endpoint architecture</title>
  <desc id="desc">LaccpMainBlock contains frame receivers and transmitters, a bus switch, RCAP, RLIGP, and pulse handling. MIKUMARI, the Heartbeat Unit, and other LACCP endpoints are external. Lines group related interfaces rather than showing every signal. Based on LaccpMainBlock.vhd and defLaccp.vhd.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10 Z" fill="#547084" />
    </marker>
    <marker id="pulse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10 Z" fill="#087f83" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="950" fill="#ffffff" />
  <text font-family="Segoe UI, Arial, sans-serif" fill="#183044" x="40" y="44" font-size="30" font-weight="700">LACCP endpoint architecture</text>
  <text font-family="Segoe UI, Arial, sans-serif" fill="#516779" x="40" y="76" font-size="18">Grouped interfaces; clocks, resets, and user ports are omitted.</text>
  <rect font-family="Segoe UI, Arial, sans-serif" fill="#f8fafc" x="300" y="200" width="930" height="590" rx="16" stroke="#aebfcd" />
  <text font-family="Segoe UI, Arial, sans-serif" fill="#183044" x="325" y="235" font-size="24" font-weight="700">LaccpMainBlock</text>
  <rect font-family="Segoe UI, Arial, sans-serif" fill="#edf5fc" x="40" y="390" width="200" height="210" rx="12" stroke="#9dbed7" />
  <text font-family="Segoe UI, Arial, sans-serif" fill="#183044" x="140" y="475" text-anchor="middle" font-size="23" font-weight="700">MIKUMARI</text>
  <text font-family="Segoe UI, Arial, sans-serif" fill="#516779" x="140" y="508" text-anchor="middle" font-size="18">link + CBT</text>
  <text font-family="Segoe UI, Arial, sans-serif" fill="#516779" x="140" y="551" text-anchor="middle" font-size="16">External block</text>
  <rect font-family="Segoe UI, Arial, sans-serif" fill="#f1f5f9" x="720" y="104" width="430" height="70" rx="12" stroke="#aebfcd" />
  <text font-family="Segoe UI, Arial, sans-serif" fill="#183044" x="935" y="134" text-anchor="middle" font-size="22" font-weight="700">External Heartbeat Unit</text>
  <text font-family="Segoe UI, Arial, sans-serif" fill="#516779" x="935" y="158" text-anchor="middle" font-size="16">PrimaryHeartBeatUnit or HeartBeatUnit</text>
  <rect font-family="Segoe UI, Arial, sans-serif" fill="#eaf7f7" x="340" y="290" width="220" height="60" rx="10" stroke="#91c9c9" />
  <text font-family="Segoe UI, Arial, sans-serif" fill="#183044" x="450" y="327" text-anchor="middle" font-size="21" font-weight="700">Pulse handling</text>
  <rect font-family="Segoe UI, Arial, sans-serif" fill="#edf5fc" x="360" y="410" width="200" height="65" rx="10" stroke="#9dbed7" />
  <text font-family="Segoe UI, Arial, sans-serif" fill="#183044" x="460" y="450" text-anchor="middle" font-size="22" font-weight="700">LaccpFrameRx</text>
  <rect font-family="Segoe UI, Arial, sans-serif" fill="#edf5fc" x="360" y="525" width="200" height="65" rx="10" stroke="#9dbed7" />
  <text font-family="Segoe UI, Arial, sans-serif" fill="#183044" x="460" y="565" text-anchor="middle" font-size="22" font-weight="700">LaccpFrameTx</text>
  <rect font-family="Segoe UI, Arial, sans-serif" fill="#f1f5f9" x="620" y="410" width="210" height="180" rx="12" stroke="#aebfcd" />
  <text font-family="Segoe UI, Arial, sans-serif" fill="#183044" x="725" y="487" text-anchor="middle" font-size="23" font-weight="700">LaccpBusSwitch</text>
  <text font-family="Segoe UI, Arial, sans-serif" fill="#516779" x="725" y="521" text-anchor="middle" font-size="17">64-bit frame bodies</text>
  <rect font-family="Segoe UI, Arial, sans-serif" fill="#eaf7f7" x="940" y="330" width="250" height="120" rx="12" stroke="#91c9c9" />
  <text font-family="Segoe UI, Arial, sans-serif" fill="#183044" x="1065" y="367" text-anchor="middle" font-size="24" font-weight="700">RCAP</text>
  <text font-family="Segoe UI, Arial, sans-serif" fill="#516779" x="1065" y="398" text-anchor="middle" font-size="18">Timing parameters, offsets,</text>
  <text font-family="Segoe UI, Arial, sans-serif" fill="#516779" x="1065" y="424" text-anchor="middle" font-size="18">and completion</text>
  <rect font-family="Segoe UI, Arial, sans-serif" fill="#eaf7f7" x="940" y="590" width="250" height="95" rx="12" stroke="#91c9c9" />
  <text font-family="Segoe UI, Arial, sans-serif" fill="#183044" x="1065" y="627" text-anchor="middle" font-size="24" font-weight="700">RLIGP</text>
  <text font-family="Segoe UI, Arial, sans-serif" fill="#516779" x="1065" y="659" text-anchor="middle" font-size="18">Link-information exchange</text>
  <rect font-family="Segoe UI, Arial, sans-serif" fill="#f1f5f9" x="575" y="840" width="300" height="65" rx="12" stroke="#aebfcd" />
  <text font-family="Segoe UI, Arial, sans-serif" fill="#183044" x="725" y="880" text-anchor="middle" font-size="21" font-weight="700">Other LACCP endpoints</text>
  <polyline fill="none" stroke="#547084" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" points="240,442 360,442" />
  <polyline fill="none" stroke="#547084" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" points="560,442 620,442" />
  <polyline fill="none" stroke="#547084" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" points="620,558 560,558" />
  <polyline fill="none" stroke="#547084" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" points="360,558 240,558" />
  <polyline fill="none" stroke="#547084" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" points="830,442 885,442 885,415 940,415" marker-start="url(#arrow)" />
  <polyline fill="none" stroke="#547084" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" points="830,558 885,558 885,638 940,638" marker-start="url(#arrow)" />
  <polyline fill="none" stroke="#547084" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" points="750,174 750,410" marker-start="url(#arrow)" />
  <polyline fill="none" stroke="#547084" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" points="725,590 725,840" marker-start="url(#arrow)" />
  <polyline fill="none" stroke="#087f83" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#pulse)" marker-end="url(#pulse)" points="140,390 140,320 340,320" />
  <polyline fill="none" stroke="#087f83" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#pulse)" marker-end="url(#pulse)" points="560,320 885,320 885,365 940,365" />
  <polyline fill="none" stroke="#087f83" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#pulse)" marker-end="url(#pulse)" points="1065,174 1065,330" />
  <rect font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#ffffff" x="258" y="415" width="85" height="24" rx="4" />
  <text font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#516779" x="300" y="433" text-anchor="middle">RX bytes</text>
  <rect font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#ffffff" x="258" y="567" width="85" height="24" rx="4" />
  <text font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#516779" x="300" y="585" text-anchor="middle">TX bytes</text>
  <rect font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#ffffff" x="710" y="365" width="80" height="26" rx="4" />
  <text font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#516779" x="750" y="384" text-anchor="middle">HBU bus</text>
  <rect font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#ffffff" x="641" y="799" width="168" height="28" rx="4" />
  <text font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#516779" x="725" y="819" text-anchor="middle">Interconnect ports</text>
  <rect font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#ffffff" x="927" y="260" width="276" height="26" rx="4" />
  <text font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#087f83" x="1065" y="279" text-anchor="middle">Heartbeat / offsets / sync status</text>
  <text font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#087f83" x="177" y="304">Pulses</text>
</svg>
